name: VoiceOS, VIC, and Touch quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s services/gateway/tests -p "test_*.py"
      - run: python -m unittest discover -s services/speech_worker/tests -p "test_*.py"
      - run: python -m unittest discover -s services/crawl4ai_adapter/tests -p "test_*.py"
      - run: python -m unittest discover -s ops/rig/tests -p "test_*.py"
      - run: python -m unittest discover -s contracts/tests -p "test_*.py"

  openapi:
    runs-on: ubuntu-latest
    env:
      REDOCLY_TELEMETRY: "off"
      REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npx --yes @redocly/cli@2.40.0 lint contracts/openapi.yaml --config contracts/redocly.yaml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/kiosk/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  vic-console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vic-console
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/vic-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/*.gradle.kts
            apps/android/gradle/wrapper/gradle-wrapper.properties
      - run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
