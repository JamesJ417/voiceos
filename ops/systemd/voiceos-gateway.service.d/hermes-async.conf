[Unit]
After=voiceos-hermes.service voiceos-hermes-skill-worker.service
Wants=voiceos-hermes.service voiceos-hermes-skill-worker.service

[Service]
Environment=VOICEOS_HERMES_ASYNC_RUNS=1
Environment=VOICEOS_HERMES_SKILL_WORKER_URL=http://127.0.0.1:8794
Environment=VOICEOS_HERMES_SKILL_WORKER_TOKEN_FILE=/etc/voiceos/hermes-skill-worker.key
