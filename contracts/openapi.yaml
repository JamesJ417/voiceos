openapi: 3.1.0
info:
  title: VoiceOS Gateway
  version: 0.11.0
servers:
  - url: http://127.0.0.1:8787
security:
  - deviceBearer: []
paths:
  /v1/devices:
    get:
      operationId: listEnrolledDevices
      responses:
        "200": { description: Credential-safe device inventory; token hashes and secrets are never returned }
  /v1/devices/{device_id}/revocation:
    post:
      operationId: proposeDeviceRevocation
      parameters:
        - { in: path, name: device_id, required: true, schema: { type: string } }
      responses:
        "202": { description: Durable one-time approval proposal; the current device cannot revoke itself }
  /v1/activity:
    get:
      operationId: listUnifiedActivity
      parameters:
        - { in: query, name: after, schema: { type: integer, minimum: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200": { description: "Unified VIC notices, decisions, models, attempts, changes, evidence, files, needs-you state, and rollback availability" }
  /v1/memory/sleep/cycles/current:
    get:
      operationId: getCurrentSleepCycle
      responses:
        "200": { description: Current or most recent bounded VIC sleep-memory cycle }
  /v1/memory/sleep/cycles:
    post:
      operationId: startSleepCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [dry_run, commit], default: dry_run }
                trigger_kind: { type: string, enum: [manual, test], default: manual }
                config: { type: object }
      responses:
        "201": { description: Completed bounded cycle and morning report }
        "503": { description: Feature flag is disabled }
  /v1/memory/sleep/cycles/{cycle_id}:
    get:
      operationId: getSleepCycle
      parameters:
        - { in: path, name: cycle_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Cycle state, evidence, metrics, and report" }
        "404": { description: Cycle does not exist }
  /v1/memory/sleep/cycles/{cycle_id}/actions:
    post:
      operationId: actOnSleepCycle
      parameters:
        - { in: path, name: cycle_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [commit, rollback, pause, resume, cancel, approve_proposal, reject_proposal, promote_dream] }
                proposal_id: { type: [string, "null"], format: uuid }
                memory_id: { type: [string, "null"], format: uuid }
                reason: { type: [string, "null"] }
      responses:
        "200": { description: Audited cycle action result }
  /v1/memory/morning-report:
    get:
      operationId: getMemoryMorningReport
      responses:
        "200": { description: "Latest concise consolidation, contradiction, dream, and skill summary" }
  /v1/memory/search:
    get:
      operationId: searchReconstructiveMemory
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: include_dreams, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Provenance-bearing active memories; dreams excluded unless explicitly requested }
  /v1/doctrine/status:
    get:
      operationId: getVicDoctrineStatus
      responses:
        "200": { description: Feature flags and identity-safe doctrine counts }
  /v1/doctrine/sources:
    get:
      operationId: listPrivateDoctrineSourceProfiles
      responses:
        "200": { description: Private source profiles; requires source-audit mode }
        "403": { description: Private source audit is disabled }
  /v1/doctrine/sources/records:
    get:
      operationId: listPrivateDoctrineSourceRecords
      responses:
        "200": { description: Private authorized source records without source content }
    post:
      operationId: registerAuthorizedDoctrineSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profile_id, source_type, title, private_origin, authorization_status, authorization_basis, source_quality, content]
              properties:
                profile_id: { type: string }
                source_type: { type: string, enum: [user_note, licensed_excerpt, public_domain, authorized_transcript, authorized_document] }
                title: { type: string, minLength: 1 }
                private_origin: { type: string, minLength: 1 }
                publication_date: { type: [string, "null"] }
                authorization_status: { type: string, const: approved }
                authorization_basis: { type: string, minLength: 1 }
                source_quality: { type: number, minimum: 0, maximum: 1 }
                content: { type: string, minLength: 1, maxLength: 1048576 }
      responses:
        "201": { description: Immutable hashed private source record }
  /v1/doctrine/sources/records/{record_id}/process:
    post:
      operationId: processAuthorizedDoctrineSource
      parameters:
        - { in: path, name: record_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Protected structured candidates; never approved or active }
        "503": { description: Doctrine extraction is disabled }
  /v1/doctrine/sources/records/{record_id}/revoke:
    post:
      operationId: revokeDoctrineSource
      parameters:
        - { in: path, name: record_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Source revoked and materially dependent active doctrine returned to review }
  /v1/doctrine/candidates:
    get:
      operationId: listDoctrineCandidates
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Structured protected doctrine candidates without private provenance }
  /v1/doctrine/candidates/{candidate_id}/decision:
    post:
      operationId: decideDoctrineCandidate
      parameters:
        - { in: path, name: candidate_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject, request_revision] }
      responses:
        "200": { description: Audited explicit candidate review; does not activate doctrine }
  /v1/doctrine/candidates/{candidate_id}/status:
    post:
      operationId: setDoctrineCandidateActive
      parameters:
        - { in: path, name: candidate_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200": { description: Separate audited activation or deactivation of previously approved doctrine }
  /v1/doctrine/candidates/{candidate_id}/provenance:
    get:
      operationId: getPrivateDoctrineProvenance
      parameters:
        - { in: path, name: candidate_id, required: true, schema: { type: string } }
      responses:
        "200": { description: Private source identity and evidence; source-audit mode required }
        "403": { description: Private source audit is disabled }
  /v1/doctrine/active:
    get:
      operationId: retrieveActiveVicDoctrine
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: Active identity-safe doctrine only; runtime flag required }
  /v1/doctrine/lenses:
    get:
      operationId: retrieveVicReasoningLenses
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        "200": { description: Abstract relevance lenses with no private source names }
  /v1/doctrine/contradictions:
    get:
      operationId: listDoctrineContradictions
      responses:
        "200": { description: Unresolved candidate tensions retained without false consensus }
  /v1/doctrine/evaluations:
    post:
      operationId: runDoctrineEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, input]
              properties:
                kind: { type: string, enum: [identity_leakage, prompt_injection, sycophancy, doctrine_fidelity, contradiction_handling, evidence_revision, style_independence, source_removal] }
                input: { type: string, minLength: 1 }
      responses:
        "200": { description: Stored deterministic doctrine evaluation evidence }
  /v1/admin/status:
    get:
      operationId: getInstallationStatus
      responses:
        "200": { description: "Installation resources, GPU, models, audio, services, backup evidence, and failures" }
  /v1/admin/actions:
    post:
      operationId: proposeAdministratorAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, target]
              properties:
                action: { type: string, enum: [restart_service, speaker_test, microphone_test] }
                target: { type: string }
      responses:
        "202": { description: Durable exact single-use root-broker approval proposal; never executes directly }
  /v1/updates:
    get:
      operationId: listUpdateProposals
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [discovered, approved, rejected, candidate_ready, deploying, deployed, failed, rolled_back] } }
      responses:
        "200":
          description: Inert owner-scoped upstream update proposals
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals: { type: array, items: { $ref: "#/components/schemas/UpdateProposal" } }
  /v1/updates/{update_id}/decision:
    post:
      operationId: decideUpdateProposal
      parameters:
        - { in: path, name: update_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties: { decision: { type: string, enum: [approve, reject] } }
      responses:
        "200": { description: Update reviewed without deploying it }
  /v1/updates/{update_id}/actions:
    post:
      operationId: proposeUpdateOperation
      parameters:
        - { in: path, name: update_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties: { action: { type: string, enum: [stage, deploy, health_check, rollback] } }
      responses:
        "200": { description: Single-use root-broker approval card; no operation executes directly }
  /v1/attention:
    get:
      operationId: listAttentionInbox
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, snoozed, resolved, dismissed] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Unified owner-scoped items requiring attention
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AttentionItem" } }
                  summary: { type: object }
    post:
      operationId: upsertAttentionItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertAttentionItem" }
      responses:
        "201": { description: Attention item created or refreshed by stable source identity }
  /v1/attention/{attention_id}/actions:
    post:
      operationId: actOnAttentionItem
      parameters:
        - { in: path, name: attention_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttentionAction" }
      responses:
        "200": { description: "Item reviewed, converted to a task, drafted, or moved" }
        "400": { description: Action is unavailable for this item }
        "404": { description: Attention item not found }
  /v1/calendar/events:
    get:
      operationId: listCalendarEvents
      parameters:
        - { in: query, name: start_at, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: end_at, required: true, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Canonical busy-time events used by the planner }
    post:
      operationId: upsertCalendarEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "201": { description: Calendar event normalized into the canonical store }
  /v1/tasks/{task_id}/schedule:
    post:
      operationId: setTaskSchedule
      parameters:
        - { in: path, name: task_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskScheduleInput" }
      responses:
        "200": { description: "Task scheduling, recurrence, location, preparation, and travel metadata updated" }
  /v1/plans/daily/work:
    post:
      operationId: buildDailyWorkPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyWorkPlanRequest" }
      responses:
        "200":
          description: Deterministic task and calendar plan with unscheduled work and replanning warnings
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: "#/components/schemas/DailyWorkPlan" }
  /v1/automations:
    get:
      operationId: listAutomations
      parameters:
        - in: query
          name: include_disabled
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Owner-scoped attention and automation rules
          content:
            application/json:
              schema:
                type: object
                required: [automations]
                properties:
                  automations: { type: array, items: { $ref: "#/components/schemas/AutomationRule" } }
    post:
      operationId: createAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAutomationRule" }
      responses:
        "201": { description: Validated automation created }
        "400": { description: "Invalid trigger, conditions, actions, frequency limit, or evidence" }
  /v1/automations/{automation_id}/enabled:
    post:
      operationId: setAutomationEnabled
      parameters:
        - in: path
          name: automation_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Automation off switch updated }
        "404": { description: Automation not found }
  /v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Gateway and model availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/tools/system.health:
    get:
      operationId: getSystemHealth
      responses:
        "200":
          description: Deterministic gateway-host health evidence
          content:
            application/json:
              schema:
                type: object
  /v1/providers:
    get:
      operationId: listProviders
      responses:
        "200": { description: Configured and disabled provider slots }
  /v1/tools:
    get:
      operationId: listTools
      responses:
        "200": { description: Allowlisted tools and approval policies }
  /v1/tools/execute:
    post:
      operationId: executeTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                arguments: { type: object }
                approved: { type: boolean, default: false }
                session_id: { type: string }
      responses:
        "200": { description: Tool result or approval-required proposal }
        "403": { description: Tool is not allowlisted }
  /v1/enrollment/sessions:
    post:
      operationId: createEnrollment
      security: []
      parameters:
        - in: header
          name: X-VoiceOS-Admin-Token
          required: true
          schema: { type: string }
      responses:
        "201": { description: One-time QR payload and expiration }
        "401": { description: Administrator authentication required }
  /v1/enrollment/exchange:
    post:
      operationId: exchangeEnrollment
      security: []
      responses:
        "201": { description: Device ID and bearer credential }
        "401": { description: "Enrollment is invalid, expired, or already used" }
  /v1/conversations/active:
    get:
      operationId: getActiveConversation
      summary: Recover the authenticated owner's current conversation snapshot
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
      responses:
        "200":
          description: The active conversation and its newest bounded message window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationSnapshot" }
        "401": { description: Device authentication required }
  /v1/conversations/active/messages:
    get:
      operationId: listActiveConversationMessages
      summary: Recover messages after a durable event cursor
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
          description: Return messages with a sequence greater than this cursor.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Ordered messages and the newest returned cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMessagePage" }
        "401": { description: Device authentication required }
  /v1/conversations/active/events:
    get:
      operationId: streamActiveConversationEvents
      summary: Subscribe to resumable active-conversation events
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
          description: Start after this sequence when Last-Event-ID is unavailable.
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: integer, minimum: 0 }
          description: Reconnection cursor used when the explicit after query is absent.
      responses:
        "200":
          description: SSE message events whose id is the durable message sequence
          content:
            text/event-stream:
              schema:
                type: string
                description: Each message event contains a ConversationMessage JSON payload.
        "401": { description: Device authentication required }
  /v1/conversations/active/floor:
    get:
      operationId: getActiveConversationFloor
      summary: Inspect the active microphone and playback lease
      responses:
        "200":
          description: Current floor state; the floor is inactive after its lease expires
          content:
            application/json:
              schema:
                type: object
                required: [floor]
                properties:
                  floor: { oneOf: [{ $ref: "#/components/schemas/ConversationFloor" }, { type: "null" }] }
    post:
      operationId: changeActiveConversationFloor
      summary: Claim, renew, update, or release the active conversation floor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationFloorRequest"
      responses:
        "200":
          description: Updated floor state
          content:
            application/json:
              schema:
                type: object
                required: [floor]
                properties:
                  floor: { $ref: "#/components/schemas/ConversationFloor" }
        "409": { description: A non-holder attempted to update an active lease }
  /v1/events:
    get:
      operationId: streamSharedClientEvents
      summary: Resume the shared messages, tasks, approvals, plans, and status stream
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Durable SSE events with globally increasing IDs
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Device authentication required }
  /v1/events/recovery:
    get:
      operationId: recoverSharedClientEvents
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Bounded durable events after the supplied cursor
          content:
            application/json:
              schema:
                type: object
                required: [after, latest_event_id, events]
                properties:
                  after: { type: integer, minimum: 0 }
                  latest_event_id: { type: integer, minimum: 0 }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ClientEvent" }
        "401": { description: Device authentication required }
  /v1/capabilities/speech/health:
    get:
      operationId: getSpeechCapabilityHealth
      summary: Inspect the isolated speech-to-speech worker and GPU scheduler
      responses:
        "200":
          description: Speech worker configuration, capacity, backend, and scheduler state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityHealth" }
        "401": { description: Device authentication required }
        "503": { description: Speech worker is unavailable }
  /v1/capabilities/crawl4ai/health:
    get:
      operationId: getCrawlCapabilityHealth
      summary: Inspect the isolated Crawl4AI adapter
      responses:
        "200":
          description: Crawl adapter configuration and availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityHealth" }
        "401": { description: Device authentication required }
        "503": { description: Crawl4AI adapter is unavailable }
  /v1/skills/proposals:
    get:
      operationId: listSkillProposals
      summary: List validated Hermes skill proposals mirrored into VoiceOS
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [proposed, approved, rejected, disabled] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Owner-scoped skill proposals with evidence and provenance
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items: { $ref: "#/components/schemas/SkillProposal" }
        "401": { description: Device authentication required }
  /v1/skills/proposals/{skill_id}/decision:
    post:
      operationId: decideSkillProposal
      summary: Approve or reject a validated Hermes skill proposal
      parameters:
        - in: path
          name: skill_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        "200":
          description: Decided proposal with immutable decision evidence
          content:
            application/json:
              schema: { type: object }
        "401": { description: Device authentication required }
        "404": { description: Skill proposal was not found }
        "409": { description: Skill proposal was already decided }
  /v1/skills:
    get:
      operationId: listSkills
      summary: List approved or disabled VoiceOS skills
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [approved, disabled], default: approved }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: Owner-scoped skill catalog
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills: { type: array, items: { $ref: "#/components/schemas/SkillProposal" } }
        "401": { description: Device authentication required }
  /v1/skills/{skill_id}/status:
    post:
      operationId: setSkillStatus
      summary: Disable an approved skill version
      parameters:
        - in: path
          name: skill_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [disabled] }
      responses:
        "200": { description: Updated skill version }
        "400": { description: Invalid lifecycle transition }
        "401": { description: Device authentication required }
        "404": { description: Skill was not found }
  /v1/skills/usages:
    get:
      operationId: listSkillUsages
      summary: List recent uses of approved skills and their review status
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recent owner-scoped skill usages
          content:
            application/json:
              schema:
                type: object
                required: [usages]
                properties:
                  usages: { type: array, items: { $ref: "#/components/schemas/SkillUsage" } }
        "401": { description: Device authentication required }
  /v1/skills/usages/{usage_id}/feedback:
    post:
      operationId: reviewSkillUsage
      summary: Mark a particular VIC skill use correct or incorrect
      parameters:
        - in: path
          name: usage_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback: { type: string, enum: [correct, incorrect] }
                note: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Reviewed skill usage }
        "400": { description: Invalid feedback }
        "401": { description: Device authentication required }
        "404": { description: Skill usage was not found }
  /v1/audit/turns:
    get:
      operationId: listAuditTurns
      responses:
        "200": { description: Recent conversation audit records }
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      responses:
        "200": { description: Recent enrollment and tool-decision events }
  /v1/agents/runs:
    get:
      operationId: listAgentRuns
      summary: List durable Codex coordinator and subagent runs
      parameters:
        - in: query
          name: task_id
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Owner-scoped Codex run tree
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/AgentRun" } }
        "401": { description: Device authentication required }
    post:
      operationId: createAgentRun
      summary: Queue a bounded top-level Codex run for VIC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRun" }
      responses:
        "202":
          description: Codex run queued; execution begins only when the supervisor claims it
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/AgentRun" }
        "400": { description: Invalid or over-broad run request }
        "401": { description: Device authentication required }
  /v1/agents/runs/{run_id}:
    get:
      operationId: getAgentRun
      summary: Inspect one Codex run, its direct children, and durable progress events
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Agent run detail and evidence }
        "401": { description: Device authentication required }
        "404": { description: Agent run not found }
  /v1/agents/runs/{run_id}/cancel:
    post:
      operationId: cancelAgentRun
      summary: Request cancellation of a non-terminal Codex run
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Agent run marked cancelled }
        "401": { description: Device authentication required }
        "404": { description: Agent run not found }
        "409": { description: Agent run changed or is already terminal }
  /v1/tasks:
    get:
      operationId: listTasks
      parameters:
        - in: query
          name: include_completed
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The primary owner's shared task board
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  details:
                    type: array
                    description: Responsibility and evidence projection for each returned task.
                    items: { $ref: "#/components/schemas/TaskDetail" }
        "401": { description: Device authentication required }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, observable_outcome, estimated_minutes]
              properties:
                title: { type: string, minLength: 1 }
                observable_outcome: { type: string, minLength: 1 }
                estimated_minutes: { type: integer, minimum: 1 }
                due_at: { type: [string, "null"], format: date-time }
                project_id: { type: [string, "null"] }
                parent_task_id: { type: [string, "null"] }
      responses:
        "201":
          description: Task created, analyzed immediately, and queued for safe proactive work
          content:
            application/json:
              schema:
                type: object
                required: [task, initiative]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
                  initiative: { $ref: "#/components/schemas/TaskInitiative" }
        "401": { description: Device authentication required }
  /v1/checkins/daily:
    get:
      operationId: getDailyCheckin
      summary: Get today's shared twelve-question planning progress
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
      responses:
        "200":
          description: Current status, durable answers, and the next question
          content:
            application/json:
              schema:
                type: object
                required: [date, status, answered, total, answers]
                properties:
                  date: { type: string, format: date }
                  status: { type: string, enum: [not_started, active, paused, completed] }
                  answered: { type: integer, minimum: 0, maximum: 12 }
                  total: { type: integer, const: 12 }
                  next_question:
                    type: [object, "null"]
                    properties:
                      index: { type: integer, minimum: 1, maximum: 12 }
                      text: { type: string }
                  answers:
                    type: array
                    items: { type: object }
        "401": { description: Device authentication required }
  /v1/outreach:
    get:
      operationId: listVicOutreach
      summary: List durable VIC check-ins and their delivery state
      parameters:
        - in: query
          name: include_closed
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Owner-scoped outreach outbox
          content:
            application/json:
              schema:
                type: object
                required: [outreach]
                properties:
                  outreach: { type: array, items: { $ref: "#/components/schemas/VicOutreach" } }
        "401": { description: Device authentication required }
    post:
      operationId: createVicOutreach
      summary: Queue an audited proactive VIC check-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVicOutreach" }
      responses:
        "201":
          description: Outreach queued and published to the shared client stream
          content:
            application/json:
              schema:
                type: object
                required: [outreach]
                properties:
                  outreach: { $ref: "#/components/schemas/VicOutreach" }
        "401": { description: Device authentication required }
  /v1/outreach/policy:
    get:
      operationId: getVicOutreachPolicy
      summary: Get quiet hours, interruption limits, and announcement preferences
      responses:
        "200":
          description: Current outreach policy
          content:
            application/json:
              schema:
                type: object
                required: [policy]
                properties:
                  policy: { $ref: "#/components/schemas/OutreachPolicy" }
        "401": { description: Device authentication required }
    post:
      operationId: updateVicOutreachPolicy
      summary: Update quiet hours, review cadence, planning, digest, location, driving, and interruption controls
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutreachPolicyUpdate" }
      responses:
        "200":
          description: Updated outreach policy
          content:
            application/json:
              schema:
                type: object
                required: [policy]
                properties:
                  policy: { $ref: "#/components/schemas/OutreachPolicy" }
        "400": { description: Invalid policy value }
        "401": { description: Device authentication required }
  /v1/outreach/{outreach_id}/actions:
    post:
      operationId: actOnVicOutreach
      summary: Record delivery, response, snooze, or dismissal
      parameters:
        - in: path
          name: outreach_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [delivered, talk_now, show_progress, hear_update, later, dismiss] }
                snooze_minutes: { type: integer, minimum: 5, maximum: 1440 }
      responses:
        "200": { description: Updated outreach state }
        "401": { description: Device authentication required }
        "404": { description: Outreach was not found }
  /v1/plans/daily:
    get:
      operationId: getDailyActionPlan
      summary: Get the plan proposed from today's twelve-question check-in
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
      responses:
        "200":
          description: Today's top priorities, next actions, blockers, dependencies, and approval items
          content:
            application/json:
              schema: { type: object }
        "401": { description: Device authentication required }
  /v1/tasks/{task_id}/status:
    post:
      operationId: updateTaskStatus
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [proposed, ready, active, blocked, completed, cancelled]
      responses:
        "200":
          description: Updated and audited task
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "401": { description: Device authentication required }
        "404": { description: Task does not exist for the primary owner }
  /v1/tasks/{task_id}:
    get:
      operationId: getTaskDetail
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task, initiative, responsibility projection, evidence, approvals, artifacts, and append-only activity
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { $ref: "#/components/schemas/TaskDetail" }
        "404": { description: Task does not exist for the primary owner }
  /v1/tasks/{task_id}/actions:
    post:
      operationId: applyTaskProgressAction
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskAction" }
      responses:
        "200": { description: Applied action and refreshed task-detail projection }
        "400": { description: Invalid or unsupported task action }
        "404": { description: "Task, step, or blocker does not exist" }
  /v1/files:
    get:
      operationId: listKnowledgeFiles
      responses:
        "200": { description: Device-owned private knowledge files }
        "401": { description: Device authentication required }
    post:
      operationId: uploadKnowledgeFile
      parameters:
        - in: header
          name: X-VoiceOS-File-Name
          required: true
          schema: { type: string }
        - in: header
          name: X-VoiceOS-Document-Mode
          required: false
          schema: { type: string, enum: [profile, reference], default: reference }
      requestBody:
        required: true
        content:
          text/plain: { schema: { type: string } }
          text/markdown: { schema: { type: string } }
          text/csv: { schema: { type: string } }
          application/json: { schema: { type: string } }
      responses:
        "201": { description: "File stored, hashed, and chunked" }
        "401": { description: Device authentication required }
        "413": { description: File exceeds 5 MB }
        "415": { description: File type is not supported }
  /v1/files/{document_id}:
    delete:
      operationId: deleteKnowledgeFile
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: File and extracted passages deleted }
        "404": { description: File does not exist for this device }
  /v1/artifacts:
    get:
      operationId: listArtifacts
      parameters:
        - in: query
          name: query
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Managed artifacts
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
  /v1/artifacts/pdfs:
    post:
      operationId: createPdfArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePdfArtifact" }
      responses:
        "202": { description: PDF generation queued }
  /v1/artifacts/events:
    get:
      operationId: streamArtifactEvents
      responses:
        "200":
          description: Server-sent artifact lifecycle events
          content:
            text/event-stream: { schema: { type: string } }
  /v1/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      parameters:
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Artifact catalog record }
        "404": { description: Artifact not found }
  /v1/artifacts/{artifact_id}/preview:
    get:
      operationId: previewArtifact
      parameters:
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Checksum-validated inline artifact bytes }
        "409": { description: Artifact is not ready }
  /v1/artifacts/{artifact_id}/download:
    get:
      operationId: downloadArtifact
      parameters:
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Checksum-validated attachment bytes }
        "409": { description: Artifact is not ready }
  /v1/artifacts/{artifact_id}/revisions:
    post:
      operationId: revisePdfArtifact
      parameters:
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePdfArtifact" }
      responses:
        "202": { description: Immutable PDF revision queued }
  /v1/ontology/catalog:
    get:
      operationId: getOntologyCatalog
      responses:
        "200":
          description: "Versioned canonical intents, entities, argument schemas, units, and approval requirements"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologyCatalog" }
        "401": { description: Device authentication required }
  /v1/ontology/interpret:
    post:
      operationId: interpretPhrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phrase]
              properties:
                phrase: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        "200":
          description: Audited canonical interpretation or an unrecognized/rejected decision
          content:
            application/json:
              schema:
                type: object
                required: [decision]
                properties:
                  decision: { $ref: "#/components/schemas/InterpretationDecision" }
        "401": { description: Device authentication required }
  /v1/ontology/aliases:
    get:
      operationId: listApprovedAliases
      responses:
        "200": { description: Owner-approved aliases visible to this enrolled identity }
    post:
      operationId: approveAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phrase, entity_kind, entity_id]
              properties:
                phrase: { type: string, minLength: 1 }
                entity_kind: { type: string, enum: [device, provider, service, document, artifact, task, person, project, skill, email, location, memory, decision] }
                entity_id: { type: string }
      responses:
        "201": { description: Alias validated against the catalog and stored }
        "400": { description: Alias phrase or canonical entity is invalid }
  /v1/ontology/interpretations/{interpretation_id}/correct:
    post:
      operationId: correctInterpretation
      parameters:
        - in: path
          name: interpretation_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request: { $ref: "#/components/schemas/CanonicalRequest" }
                note: { type: string }
      responses:
        "200": { description: Corrected interpretation with durable correction history }
        "400": { description: Correction failed schema validation or is not owned by this identity }
  /v1/approvals/decide:
    post:
      operationId: decideApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, decision]
              properties:
                request_id: { type: string, format: uuid }
                decision: { type: string, enum: [approve, deny] }
      responses:
        "200": { description: Approval decision and optional tool result }
        "404": { description: Approval request does not exist }
        "409": { description: Approval expired or was already decided }
  /v1/sessions:
    post:
      operationId: createSession
      responses:
        "201":
          description: New conversation session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /v1/speech/sessions:
    post:
      operationId: createSpeechSession
      summary: Reserve a short-lived authenticated speech-to-speech session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id]
              properties:
                conversation_id: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Pending speech session and private stream path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeechSession" }
        "401": { description: Device authentication required }
        "429": { description: Speech capacity has been reached }
        "503": { description: Speech backend is unavailable }
  /v1/retrieval/web:
    post:
      operationId: retrieveWebEvidence
      summary: Retrieve one public web page as untrusted evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 4096 }
      responses:
        "200":
          description: Bounded evidence that cannot issue VoiceOS instructions
          content:
            application/json:
              schema:
                type: object
                required: [evidence]
                properties:
                  evidence: { $ref: "#/components/schemas/RetrievalEvidence" }
        "400": { description: URL violates the public-network retrieval policy }
        "401": { description: Device authentication required }
        "503": { description: Crawl4AI adapter is unavailable }
  /v1/turns/audio:
    post:
      operationId: submitAudioTurn
      parameters:
        - in: header
          name: X-Session-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: audio/L16;rate=16000;channels=1
      responses:
        "200":
          description: Completed mock turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "413":
          description: Audio payload is too large
  /v1/turns/text:
    post:
      operationId: submitTextTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                session_id:
                  type: string
                  description: Compatibility alias; authenticated devices resume their server-owned active conversation.
                text: { type: string, minLength: 1, maxLength: 8000 }
                provider:
                  type: string
                  description: Optional explicit provider hint for trusted clients.
      responses:
        "200":
          description: Completed text turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "400":
          description: Invalid JSON or missing text
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: VoiceOSDeviceCredential
  parameters:
    DeviceAuthorization:
      in: header
      name: Authorization
      required: true
      schema: { type: string, pattern: "^Bearer .+" }
      description: Bearer credential issued during device enrollment.
  schemas:
    OntologyCatalog:
      type: object
      required: [version, minimum_compatible_version, entity_kinds, intents, entities]
      properties:
        version: { type: integer, minimum: 2 }
        minimum_compatible_version: { type: integer, minimum: 1 }
        entity_kinds:
          type: array
          items: { type: string, enum: [device, provider, service, document, artifact, task, person, project, skill, email, location, memory, decision] }
        intents: { type: array, items: { type: object } }
        entities: { type: array, items: { type: object } }
    Artifact:
      type: object
      required: [id, owner_id, kind, title, filename, media_type, status, progress_percent, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        owner_id: { type: string }
        job_id: { type: [string, "null"] }
        task_id: { type: [string, "null"] }
        parent_artifact_id: { type: [string, "null"] }
        kind: { type: string }
        title: { type: string }
        filename: { type: string }
        media_type: { type: string }
        description: { type: string }
        status: { type: string, enum: [queued, generating, validating, ready, failed] }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        storage_key: { type: [string, "null"] }
        uri: { type: string }
        sha256: { type: [string, "null"] }
        byte_size: { type: [integer, "null"], minimum: 0 }
        version: { type: integer, minimum: 1 }
        metadata: { type: object }
        error: { type: [string, "null"] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"] }
    CreatePdfArtifact:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        filename: { type: string }
        task_id: { type: string }
        template: { type: string, enum: [recipe-card] }
        spec:
          type: object
          required: [title, sections]
          properties:
            title: { type: string }
            subtitle: { type: string }
            sections:
              type: array
              items:
                type: object
                required: [heading, body]
                properties:
                  heading: { type: string }
                  body: { type: string }
            footer: { type: string }
    Health:
      type: object
      required: [status, gateway, speech_to_text, language_model, text_to_speech]
      properties:
        status: { type: string, enum: [ok, degraded] }
        gateway: { type: string }
        speech_to_text: { type: string }
        language_model: { type: string }
        text_to_speech: { type: string }
    CapabilityHealth:
      type: object
      required: [status]
      additionalProperties: true
      properties:
        status: { type: string, enum: [ok, degraded] }
        configured: { type: boolean }
    SkillProposal:
      type: object
      required: [id, name, version, status, content, required_capabilities, evidence, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [proposed, approved, rejected, disabled] }
        content: { type: string }
        content_sha256: { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
        source_run_id: { type: [string, "null"] }
        required_capabilities:
          type: array
          items: { type: string }
        evidence:
          type: array
          items: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SkillUsage:
      type: object
      required: [id, owner_id, skill_id, skill_name, skill_version, tool_calls, result, outcome, used_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string }
        skill_id: { type: string, format: uuid }
        skill_name: { type: string }
        skill_version: { type: integer, minimum: 1 }
        conversation_id: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        tool_calls: { type: array, items: { type: object } }
        result: { type: object }
        outcome: { type: string, enum: [completed, failed] }
