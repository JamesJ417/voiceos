openapi: 3.1.0
info:
  title: VoiceOS Gateway
  version: 0.8.0
servers:
  - url: http://127.0.0.1:8787
security:
  - deviceBearer: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Gateway and model availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/client/bootstrap:
    get:
      operationId: getClientBootstrap
      summary: Discover the canonical VoiceOS contract and registered system components
      responses:
        "200":
          description: Authenticated client contract and component registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBootstrap"
        "401": { description: Device authentication required }
  /v1/console/commands:
    post:
      operationId: dispatchConsoleCommand
      summary: Deliver one allowlisted command to the local VIC Console
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsoleCommandRequest"
      responses:
        "200":
          description: Command was accepted by the owner-only local Console socket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleCommandResult"
        "400": { description: Command or request shape is not allowlisted }
        "401": { description: Device authentication required }
        "503": { description: VIC Console is not currently available }
  /v1/tools/system.health:
    get:
      operationId: getSystemHealth
      responses:
        "200":
          description: Deterministic gateway-host health evidence
          content:
            application/json:
              schema:
                type: object
  /v1/providers:
    get:
      operationId: listProviders
      responses:
        "200": { description: Configured and disabled provider slots }
  /v1/tools:
    get:
      operationId: listTools
      responses:
        "200": { description: Allowlisted tools and approval policies }
  /v1/tools/execute:
    post:
      operationId: executeTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                arguments: { type: object }
                approved: { type: boolean, default: false }
                session_id: { type: string }
      responses:
        "200": { description: Tool result or approval-required proposal }
        "403": { description: Tool is not allowlisted }
  /v1/enrollment/sessions:
    post:
      operationId: createEnrollment
      security: []
      parameters:
        - in: header
          name: X-VoiceOS-Admin-Token
          required: true
          schema: { type: string }
      responses:
        "201": { description: One-time QR payload and expiration }
        "401": { description: Administrator authentication required }
  /v1/enrollment/exchange:
    post:
      operationId: exchangeEnrollment
      security: []
      responses:
        "201": { description: Device ID and bearer credential }
        "401": { description: "Enrollment is invalid, expired, or already used" }
  /v1/conversations/active:
    get:
      operationId: getActiveConversation
      summary: Recover the authenticated owner's current conversation snapshot
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
      responses:
        "200":
          description: The active conversation and its newest bounded message window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationSnapshot" }
        "401": { description: Device authentication required }
  /v1/conversations/active/messages:
    get:
      operationId: listActiveConversationMessages
      summary: Recover messages after a durable event cursor
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
          description: Return messages with a sequence greater than this cursor.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Ordered messages and the newest returned cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMessagePage" }
        "401": { description: Device authentication required }
  /v1/conversations/active/events:
    get:
      operationId: streamActiveConversationEvents
      summary: Subscribe to resumable active-conversation events
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
          description: Start after this sequence when Last-Event-ID is unavailable.
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: integer, minimum: 0 }
          description: Reconnection cursor used when the explicit after query is absent.
      responses:
        "200":
          description: SSE message events whose id is the durable message sequence
          content:
            text/event-stream:
              schema:
                type: string
                description: Each message event contains a ConversationMessage JSON payload.
        "401": { description: Device authentication required }
  /v1/conversations/active/floor:
    get:
      operationId: getActiveConversationFloor
      summary: Inspect the active microphone and playback lease
      responses:
        "200":
          description: Current floor state; the floor is inactive after its lease expires
          content:
            application/json:
              schema:
                type: object
                required: [floor]
                properties:
                  floor: { oneOf: [{ $ref: "#/components/schemas/ConversationFloor" }, { type: "null" }] }
    post:
      operationId: changeActiveConversationFloor
      summary: Claim, renew, update, or release the active conversation floor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationFloorRequest"
      responses:
        "200":
          description: Updated floor state
          content:
            application/json:
              schema:
                type: object
                required: [floor]
                properties:
                  floor: { $ref: "#/components/schemas/ConversationFloor" }
        "409": { description: A non-holder attempted to update an active lease }
  /v1/events:
    get:
      operationId: streamSharedClientEvents
      summary: Resume the shared messages, tasks, approvals, plans, and status stream
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Durable SSE events with globally increasing IDs
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Device authentication required }
  /v1/events/recovery:
    get:
      operationId: recoverSharedClientEvents
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Bounded durable events after the supplied cursor
          content:
            application/json:
              schema:
                type: object
                required: [after, latest_event_id, events]
                properties:
                  after: { type: integer, minimum: 0 }
                  latest_event_id: { type: integer, minimum: 0 }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ClientEvent" }
        "401": { description: Device authentication required }
  /v1/capabilities/speech/health:
    get:
      operationId: getSpeechCapabilityHealth
      summary: Inspect the isolated speech-to-speech worker and GPU scheduler
      responses:
        "200":
          description: Speech worker configuration, capacity, backend, and scheduler state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityHealth" }
        "401": { description: Device authentication required }
        "503": { description: Speech worker is unavailable }
  /v1/capabilities/crawl4ai/health:
    get:
      operationId: getCrawlCapabilityHealth
      summary: Inspect the isolated Crawl4AI adapter
      responses:
        "200":
          description: Crawl adapter configuration and availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityHealth" }
        "401": { description: Device authentication required }
        "503": { description: Crawl4AI adapter is unavailable }
  /v1/skills/proposals:
    get:
      operationId: listSkillProposals
      summary: List validated Hermes skill proposals mirrored into VoiceOS
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [proposed, approved, rejected, disabled] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Owner-scoped skill proposals with evidence and provenance
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items: { $ref: "#/components/schemas/SkillProposal" }
        "401": { description: Device authentication required }
  /v1/skills/proposals/{skill_id}/decision:
    post:
      operationId: decideSkillProposal
      summary: Approve or reject a validated Hermes skill proposal
      parameters:
        - in: path
          name: skill_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        "200":
          description: Decided proposal with immutable decision evidence
          content:
            application/json:
              schema: { type: object }
        "401": { description: Device authentication required }
        "404": { description: Skill proposal was not found }
        "409": { description: Skill proposal was already decided }
  /v1/skills:
    get:
      operationId: listSkills
      summary: List approved or disabled VoiceOS skills
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [approved, disabled], default: approved }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: Owner-scoped skill catalog
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills: { type: array, items: { $ref: "#/components/schemas/SkillProposal" } }
        "401": { description: Device authentication required }
  /v1/skills/{skill_id}/status:
    post:
      operationId: setSkillStatus
      summary: Disable an approved skill version
      parameters:
        - in: path
          name: skill_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [disabled] }
      responses:
        "200": { description: Updated skill version }
        "400": { description: Invalid lifecycle transition }
        "401": { description: Device authentication required }
        "404": { description: Skill was not found }
  /v1/skills/usages:
    get:
      operationId: listSkillUsages
      summary: List recent uses of approved skills and their review status
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recent owner-scoped skill usages
          content:
            application/json:
              schema:
                type: object
                required: [usages]
                properties:
                  usages: { type: array, items: { $ref: "#/components/schemas/SkillUsage" } }
        "401": { description: Device authentication required }
  /v1/skills/usages/{usage_id}/feedback:
    post:
      operationId: reviewSkillUsage
      summary: Mark a particular VIC skill use correct or incorrect
      parameters:
        - in: path
          name: usage_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback: { type: string, enum: [correct, incorrect] }
                note: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Reviewed skill usage }
        "400": { description: Invalid feedback }
        "401": { description: Device authentication required }
        "404": { description: Skill usage was not found }
  /v1/audit/turns:
    get:
      operationId: listAuditTurns
      responses:
        "200": { description: Recent conversation audit records }
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      responses:
        "200": { description: Recent enrollment and tool-decision events }
  /v1/projects:
    get:
      operationId: listProjects
      summary: List the authenticated owner's VIC projects
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Owner-scoped projects used to organize shared work
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "401": { description: Device authentication required }
    post:
      operationId: createProject
      summary: Create a project without assigning existing work automatically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 160 }
                goal_id: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: Owner-scoped project created
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "401": { description: Device authentication required }
  /v1/tasks:
    get:
      operationId: listTasks
      parameters:
        - in: query
          name: include_completed
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The primary owner's shared task board
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  details:
                    type: array
                    description: Responsibility and evidence projection for each returned task.
                    items: { $ref: "#/components/schemas/TaskDetail" }
        "401": { description: Device authentication required }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, observable_outcome, estimated_minutes]
              properties:
                title: { type: string, minLength: 1 }
                observable_outcome: { type: string, minLength: 1 }
                estimated_minutes: { type: integer, minimum: 1 }
                project_id: { type: [string, "null"] }
                parent_task_id: { type: [string, "null"] }
                due_at: { type: [string, "null"], format: date-time }
                importance: { type: string, enum: [low, normal, high, critical], default: normal }
      responses:
        "201":
          description: Task created, analyzed immediately, and queued for safe proactive work
          content:
            application/json:
              schema:
                type: object
                required: [task, initiative]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
                  initiative: { $ref: "#/components/schemas/TaskInitiative" }
        "401": { description: Device authentication required }
  /v1/personal/captures:
    post:
      operationId: createPersonalCapture
      summary: Park a temporary thought for later review without creating a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, source_id, text]
              properties:
                source: { type: string, enum: [voice, touch, android, fieldy] }
                source_id: { type: string, minLength: 1, maxLength: 200 }
                text: { type: string, minLength: 1, maxLength: 100000 }
                retention_hours: { type: integer, minimum: 1, default: 48 }
      responses:
        "201":
          description: Temporary owner-scoped capture
          content:
            application/json:
              schema:
                type: object
                required: [capture]
                properties:
                  capture: { $ref: "#/components/schemas/PersonalCapture" }
        "400": { description: Invalid capture }
        "401": { description: Device authentication required }
  /v1/personal/inbox:
    get:
      operationId: listPersonalCaptures
      summary: List only active captures still waiting for review
      responses:
        "200":
          description: Active capture inbox
          content:
            application/json:
              schema:
                type: object
                required: [captures]
                properties:
                  captures:
                    type: array
                    items: { $ref: "#/components/schemas/PersonalCapture" }
        "401": { description: Device authentication required }
  /v1/personal/captures/{capture_id}/decision:
    post:
      operationId: decidePersonalCapture
      summary: Discard, reject, snooze, or close one active capture
      parameters:
        - in: path
          name: capture_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalDecision" }
      responses:
        "200": { description: Capture decision recorded }
        "400": { description: Capture is unavailable or already decided }
        "401": { description: Device authentication required }
  /v1/personal/captures/{capture_id}/extract:
    post:
      operationId: extractPersonalCapture
      summary: Ask the configured VIC provider for bounded review suggestions
      parameters:
        - in: path
          name: capture_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider: { type: string, description: Optional configured provider override }
      responses:
        "200":
          description: Suggestions validated by VoiceOS and waiting for explicit review
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    maxItems: 8
                    items: { $ref: "#/components/schemas/PersonalProposal" }
        "400": { description: Provider output failed the bounded extraction contract }
        "401": { description: Device authentication required }
        "502": { description: Provider returned malformed structured output }
        "503": { description: VIC provider or personal support is unavailable }
  /v1/personal/proposals:
    get:
      operationId: listPersonalProposals
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Reviewable suggestions, never automatic commitments
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items: { $ref: "#/components/schemas/PersonalProposal" }
        "401": { description: Device authentication required }
  /v1/personal/proposals/{proposal_id}/approve:
    post:
      operationId: approvePersonalProposal
      summary: Convert an explicitly approved suggestion into a task or typed review record
      parameters:
        - in: path
          name: proposal_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audit_id]
              properties:
                status: { type: string, enum: [Proposed, Ready] }
                estimated_minutes: { type: integer, minimum: 1, maximum: 1440, default: 30 }
                audit_id: { type: string, minLength: 1 }
      responses:
        "200": { description: Approved task or typed review record }
        "400": { description: Proposal is unavailable or already decided }
        "401": { description: Device authentication required }
  /v1/personal/proposals/{proposal_id}/decision:
    post:
      operationId: decidePersonalProposal
      summary: Reject, snooze, or discard a review suggestion without downstream action
      parameters:
        - in: path
          name: proposal_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalDecision" }
      responses:
        "200": { description: Proposal decision recorded }
        "400": { description: Proposal is unavailable or already decided }
        "401": { description: Device authentication required }
  /v1/personal/reviews:
    get:
      operationId: listPersonalReviewRecords
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200": { description: "Approved local notes, ideas, worries, and appointments" }
        "401": { description: Device authentication required }
  /v1/personal/focus-reset:
    get:
      operationId: getPersonalFocusReset
      summary: Return one restart action, a five-minute version, and no more than three priorities
      parameters:
        - in: query
          name: mode
          schema: { type: string, enum: [normal, five_minute, low_energy, restart], default: normal }
      responses:
        "200":
          description: Gentle owner-scoped reset with no outbound side effects
          content:
            application/json:
              schema:
                type: object
                required: [focus_reset]
                properties:
                  focus_reset: { $ref: "#/components/schemas/PersonalFocusReset" }
        "401": { description: Device authentication required }
  /v1/personal/daily-reset:
    post:
      operationId: createPersonalDailyReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reset_date, audit_id]
              properties:
                reset_date: { type: string, format: date }
                audit_id: { type: string, minLength: 1 }
      responses:
        "201": { description: Daily reset checkpoint recorded }
        "400": { description: Invalid or duplicate reset request }
        "401": { description: Device authentication required }
  /v1/integrations/fieldy/transcripts:
    post:
      operationId: receiveFieldyTranscript
      security: []
      summary: Receive a signed Fieldy transcript as a temporary personal capture
      parameters:
        - in: header
          name: X-Fieldy-Signature
          required: true
          schema: { type: string, pattern: "^sha256=[0-9a-fA-F]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldyTranscriptEvent" }
      responses:
        "201":
          description: Transcript captured idempotently by Fieldy event ID
          content:
            application/json:
              schema:
                type: object
                required: [capture]
                properties:
                  capture: { $ref: "#/components/schemas/PersonalCapture" }
        "400": { description: Invalid Fieldy event }
        "401": { description: Invalid webhook signature }
        "413": { description: Webhook body exceeds one megabyte }
        "503": { description: Fieldy intake is not configured }
  /v1/focus:
    get:
      operationId: getFocusSnapshot
      summary: Get one recommended next action and no more than three priorities
      parameters:
        - in: query
          name: mode
          schema: { type: string, enum: [normal, five_minute, low_energy, restart], default: normal }
      responses:
        "200":
          description: Owner-scoped focus state and restart point
          content:
            application/json:
              schema:
                type: object
                required: [focus]
                properties:
                  focus: { $ref: "#/components/schemas/FocusSnapshot" }
        "401": { description: Device authentication required }
  /v1/focus/sessions:
    post:
      operationId: startFocusSession
      summary: Start a bounded session on an explicit or recommended ready task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id: { type: string, format: uuid }
                mode: { type: string, enum: [normal, five_minute, low_energy, restart], default: normal }
                planned_minutes: { type: integer, minimum: 1, maximum: 120 }
      responses:
        "201":
          description: Focus session started without changing task completion
          content:
            application/json:
              schema:
                type: object
                required: [session, focus]
                properties:
                  session: { $ref: "#/components/schemas/FocusSession" }
                  focus: { $ref: "#/components/schemas/FocusSnapshot" }
        "400": { description: Invalid focus request or an active session already exists }
        "401": { description: Device authentication required }
        "409": { description: No ready focus action is available }
  /v1/focus/captures:
    post:
      operationId: captureFocusIdea
      summary: Park a new idea without replacing the current focus session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttentionCapture" }
      responses:
        "201":
          description: Idea captured as proposed work while current focus remains unchanged
          content:
            application/json:
              schema:
                type: object
                required: [task, focus]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
                  focus: { $ref: "#/components/schemas/FocusSnapshot" }
                  duplicate: { type: boolean }
        "400": { description: Invalid capture }
        "401": { description: Device authentication required }
  /v1/focus/switch:
    post:
      operationId: switchFocusSafely
      summary: Deliberately switch focus after preserving the active restart point
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FocusSwitch" }
      responses:
        "200":
          description: Previous focus preserved and requested focus session active
          content:
            application/json:
              schema:
                type: object
                required: [session, focus, previous_saved]
                properties:
                  session: { $ref: "#/components/schemas/FocusSession" }
                  focus: { $ref: "#/components/schemas/FocusSnapshot" }
                  previous_saved: { type: boolean }
        "400": { description: Invalid focus target }
        "401": { description: Device authentication required }
        "409": { description: Requested task cannot be focused }
  /v1/focus/sessions/{session_id}/actions:
    post:
      operationId: actOnFocusSession
      summary: Save an interruption, resume a restart point, or end time-boxed focus
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FocusAction" }
      responses:
        "200":
          description: Updated session and refreshed focus snapshot
          content:
            application/json:
              schema:
                type: object
                required: [session, focus]
                properties:
                  session: { $ref: "#/components/schemas/FocusSession" }
                  focus: { $ref: "#/components/schemas/FocusSnapshot" }
        "400": { description: Invalid action or session state }
        "401": { description: Device authentication required }
  /v1/tasks/{task_id}/attention:
    post:
      operationId: setTaskAttention
      summary: Set the real deadline and importance used by focus ranking
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskAttention" }
      responses:
        "200":
          description: Updated task attention metadata
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "400": { description: Invalid deadline or importance }
        "401": { description: Device authentication required }
        "404": { description: Task not found }
  /v1/checkins/daily:
    get:
      operationId: getDailyCheckin
      summary: Get today's shared twelve-question planning progress
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
      responses:
        "200":
          description: Current status, durable answers, and the next question
          content:
            application/json:
              schema:
                type: object
                required: [date, status, answered, total, answers]
                properties:
                  date: { type: string, format: date }
                  status: { type: string, enum: [not_started, active, paused, completed] }
                  answered: { type: integer, minimum: 0, maximum: 12 }
                  total: { type: integer, const: 12 }
                  next_question:
                    type: [object, "null"]
                    properties:
                      index: { type: integer, minimum: 1, maximum: 12 }
                      text: { type: string }
                  answers:
                    type: array
                    items: { type: object }
        "401": { description: Device authentication required }
  /v1/outreach:
    get:
      operationId: listVicOutreach
      summary: List durable VIC check-ins and their delivery state
      parameters:
        - in: query
          name: include_closed
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Owner-scoped outreach outbox
          content:
            application/json:
              schema:
                type: object
                required: [outreach]
                properties:
                  outreach: { type: array, items: { $ref: "#/components/schemas/VicOutreach" } }
        "401": { description: Device authentication required }
    post:
      operationId: createVicOutreach
      summary: Queue an audited proactive VIC check-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVicOutreach" }
      responses:
        "201":
          description: Outreach queued and published to the shared client stream
          content:
            application/json:
              schema:
                type: object
                required: [outreach]
                properties:
                  outreach: { $ref: "#/components/schemas/VicOutreach" }
        "401": { description: Device authentication required }
  /v1/outreach/policy:
    get:
      operationId: getVicOutreachPolicy
      summary: Get quiet hours, interruption limits, and announcement preferences
      responses:
        "200": { description: Current outreach policy }
        "401": { description: Device authentication required }
  /v1/outreach/{outreach_id}/actions:
    post:
      operationId: actOnVicOutreach
      summary: Record delivery, response, snooze, or dismissal
      parameters:
        - in: path
          name: outreach_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [delivered, talk_now, show_progress, hear_update, later, dismiss] }
                snooze_minutes: { type: integer, minimum: 5, maximum: 1440 }
      responses:
        "200": { description: Updated outreach state }
        "401": { description: Device authentication required }
        "404": { description: Outreach was not found }
  /v1/plans/daily:
    get:
      operationId: getDailyActionPlan
      summary: Get the plan proposed from today's twelve-question check-in
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
      responses:
        "200":
          description: Today's top priorities, next actions, blockers, dependencies, and approval items
          content:
            application/json:
              schema: { type: object }
        "401": { description: Device authentication required }
  /v1/tasks/{task_id}/status:
    post:
      operationId: updateTaskStatus
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [proposed, ready, active, blocked, completed, cancelled]
      responses:
        "200":
          description: Updated and audited task
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "401": { description: Device authentication required }
        "404": { description: Task does not exist for the primary owner }
  /v1/tasks/{task_id}/project:
    post:
      operationId: assignTaskProject
      summary: Move a task into an owner-scoped project or back to loose work
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: Updated and audited task assignment
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "400": { description: Project is invalid or belongs to another owner }
        "401": { description: Device authentication required }
        "404": { description: Task does not exist for the primary owner }
  /v1/tasks/{task_id}:
    get:
      operationId: getTaskDetail
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task, initiative, responsibility projection, evidence, approvals, artifacts, and append-only activity
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { $ref: "#/components/schemas/TaskDetail" }
        "404": { description: Task does not exist for the primary owner }
  /v1/tasks/{task_id}/actions:
    post:
      operationId: applyTaskProgressAction
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskAction" }
      responses:
        "200": { description: Applied action and refreshed task-detail projection }
        "400": { description: Invalid or unsupported task action }
        "404": { description: "Task, step, or blocker does not exist" }
  /v1/files:
    get:
      operationId: listKnowledgeFiles
      responses:
        "200": { description: Device-owned private knowledge files }
        "401": { description: Device authentication required }
    post:
      operationId: uploadKnowledgeFile
      parameters:
        - in: header
          name: X-VoiceOS-File-Name
          required: true
          schema: { type: string }
        - in: header
          name: X-VoiceOS-Document-Mode
          required: false
          schema: { type: string, enum: [profile, reference], default: reference }
      requestBody:
        required: true
        content:
          text/plain: { schema: { type: string } }
          text/markdown: { schema: { type: string } }
          text/csv: { schema: { type: string } }
          application/json: { schema: { type: string } }
      responses:
        "201": { description: "File stored, hashed, and chunked" }
        "401": { description: Device authentication required }
        "413": { description: File exceeds 5 MB }
        "415": { description: File type is not supported }
  /v1/files/{document_id}:
    delete:
      operationId: deleteKnowledgeFile
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: File and extracted passages deleted }
        "404": { description: File does not exist for this device }
  /v1/ontology/catalog:
    get:
      operationId: getOntologyCatalog
      responses:
        "200": { description: "Versioned canonical intents, entities, argument schemas, units, and approval requirements" }
        "401": { description: Device authentication required }
  /v1/ontology/interpret:
    post:
      operationId: interpretPhrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phrase]
              properties:
                phrase: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        "200":
          description: Audited canonical interpretation or an unrecognized/rejected decision
          content:
            application/json:
              schema:
                type: object
                required: [decision]
                properties:
                  decision: { $ref: "#/components/schemas/InterpretationDecision" }
        "401": { description: Device authentication required }
  /v1/ontology/aliases:
    get:
      operationId: listApprovedAliases
      responses:
        "200": { description: Owner-approved aliases visible to this enrolled identity }
    post:
      operationId: approveAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phrase, entity_kind, entity_id]
              properties:
                phrase: { type: string, minLength: 1 }
                entity_kind: { type: string, enum: [device, provider, service, document, memory, decision] }
                entity_id: { type: string }
      responses:
        "201": { description: Alias validated against the catalog and stored }
        "400": { description: Alias phrase or canonical entity is invalid }
  /v1/ontology/interpretations/{interpretation_id}/correct:
    post:
      operationId: correctInterpretation
      parameters:
        - in: path
          name: interpretation_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request: { $ref: "#/components/schemas/CanonicalRequest" }
                note: { type: string }
      responses:
        "200": { description: Corrected interpretation with durable correction history }
        "400": { description: Correction failed schema validation or is not owned by this identity }
  /v1/approvals/decide:
    post:
      operationId: decideApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, decision]
              properties:
                request_id: { type: string, format: uuid }
                decision: { type: string, enum: [approve, deny] }
      responses:
        "200": { description: Approval decision and optional tool result }
        "404": { description: Approval request does not exist }
        "409": { description: Approval expired or was already decided }
  /v1/sessions:
    post:
      operationId: createSession
      responses:
        "201":
          description: New conversation session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /v1/speech/synthesize:
    post:
      operationId: synthesizeSpeech
      summary: Synthesize a bounded VIC response for authenticated playback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 8000 }
                voice: { type: string }
      responses:
        "200": { description: Audio response and playback metadata }
        "400": { description: Speech request is invalid }
        "401": { description: Device authentication required }
        "503": { description: Speech synthesis is unavailable }
  /v1/speech/sessions:
    post:
      operationId: createSpeechSession
      summary: Reserve a short-lived authenticated speech-to-speech session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id]
              properties:
                conversation_id: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Pending speech session and private stream path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeechSession" }
        "401": { description: Device authentication required }
        "429": { description: Speech capacity has been reached }
        "503": { description: Speech backend is unavailable }
  /v1/retrieval/web:
    post:
      operationId: retrieveWebEvidence
      summary: Retrieve one public web page as untrusted evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 4096 }
      responses:
        "200":
          description: Bounded evidence that cannot issue VoiceOS instructions
          content:
            application/json:
              schema:
                type: object
                required: [evidence]
                properties:
                  evidence: { $ref: "#/components/schemas/RetrievalEvidence" }
        "400": { description: URL violates the public-network retrieval policy }
        "401": { description: Device authentication required }
        "503": { description: Crawl4AI adapter is unavailable }
  /v1/turns/audio:
    post:
      operationId: submitAudioTurn
      parameters:
        - in: header
          name: X-Session-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: audio/L16;rate=16000;channels=1
      responses:
        "200":
          description: Completed mock turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "413":
          description: Audio payload is too large
  /v1/transcriptions:
    post:
      operationId: transcribeAudio
      summary: Transcribe a bounded desktop microphone recording
      requestBody:
        required: true
        content:
          audio/webm:
            schema: { type: string, contentMediaType: audio/webm }
          audio/ogg:
            schema: { type: string, contentMediaType: audio/ogg }
          audio/wav:
            schema: { type: string, contentMediaType: audio/wav }
      responses:
        "200":
          description: Recognized speech
          content:
            application/json:
              schema:
                type: object
                required: [transcript]
                properties:
                  transcript: { type: string }
        "400": { description: Audio body is empty or incomplete }
        "401": { description: Device authentication required }
        "413": { description: Audio payload is too large }
        "503": { description: Speech transcription is unavailable or no speech was detected }
  /v1/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload an authenticated image for a later idempotent text turn
      parameters:
        - $ref: "#/components/parameters/DeviceAuthorization"
        - in: header
          name: X-VoiceOS-File-Name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary, maxLength: 5242880 } }
          image/png: { schema: { type: string, format: binary, maxLength: 5242880 } }
          image/webp: { schema: { type: string, format: binary, maxLength: 5242880 } }
      responses:
        "201":
          description: Immutable uploaded attachment metadata
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment: { $ref: "#/components/schemas/Attachment" }
        "400": { description: Empty upload or missing filename }
        "401": { description: Device authentication required }
        "413": { description: Attachment exceeds 5 MB }
        "415": { description: Unsupported or mismatched image content }
  /v1/attachments/{attachment_id}:
    get:
      operationId: getAttachmentContent
      summary: Fetch authenticated image content for the current owner
      parameters:
        - in: path
          name: attachment_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Immutable image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { description: Device authentication required }
        "404": { description: Attachment does not exist for the current owner }
  /v1/uploads:
    post:
      operationId: createResumableUpload
      summary: Create an authenticated resumable image upload session
      parameters:
        - in: header
          name: X-VoiceOS-File-Name
          required: true
          schema: { type: string }
        - in: header
          name: X-VoiceOS-Upload-Length
          required: true
          schema: { type: integer, minimum: 1, maximum: 26214400 }
        - in: header
          name: X-VoiceOS-Upload-SHA256
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "201": { description: Resumable upload session created }
        "400": { description: Missing or invalid upload metadata }
        "401": { description: Device authentication required }
        "413": { description: Upload exceeds 25 MB }
        "415": { description: Unsupported image media type }
  /v1/uploads/{upload_id}/chunks/{offset}:
    put:
      operationId: uploadResumableChunk
      summary: Append an idempotent chunk to an authenticated image upload
      parameters:
        - in: path
          name: upload_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: offset
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 1048576 }
      responses:
        "200": { description: Chunk accepted or identical retry acknowledged }
        "400": { description: Empty or oversized chunk }
        "401": { description: Device authentication required }
        "404": { description: Upload session does not exist for the current owner and device }
        "409": { description: Offset conflicts with the current upload state }
  /v1/uploads/{upload_id}/finalize:
    post:
      operationId: finalizeResumableUpload
      summary: Verify and finalize an authenticated image upload
      parameters:
        - in: path
          name: upload_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Previously finalized upload returned idempotently }
        "201": { description: Upload verified and attachment created }
        "401": { description: Device authentication required }
        "404": { description: Upload session does not exist for the current owner }
        "409": { description: Upload is incomplete }
        "415": { description: Uploaded bytes do not match the declared image type }
        "422": { description: Uploaded bytes do not match the declared SHA-256 }
  /v1/memories:
    get:
      operationId: listMemories
      parameters:
        - in: query
          name: query
          schema: { type: string }
        - in: query
          name: include_inactive
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Owner-scoped durable memories
          content:
            application/json:
              schema:
                type: object
                required: [memories]
                properties:
                  memories: { type: array, items: { $ref: "#/components/schemas/Memory" } }
    post:
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "201": { description: Explicit owner memory created }
        "400": { description: Memory content or category is invalid }
  /v1/memories/{memory_id}:
    delete:
      operationId: forgetMemory
      parameters:
        - in: path
          name: memory_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Memory marked forgotten }
        "404": { description: Memory was not found }
  /v1/memories/{memory_id}/correct:
    post:
      operationId: correctMemory
      parameters:
        - in: path
          name: memory_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "200": { description: Corrected memory created with retained provenance }
        "400": { description: Memory content or category is invalid }
  /v1/memory/sleep-cycles:
    get:
      operationId: listMemorySleepCycles
      responses:
        "200": { description: Owner-scoped sleep-cycle reports and proposals }
    post:
      operationId: scanMemorySleepCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, minLength: 1 }
      responses:
        "201": { description: Dry-run scan persisted; no memory was changed }
  /v1/memory/sleep-cycles/{sleep_cycle_id}:
    parameters:
      - in: path
        name: sleep_cycle_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMemorySleepCycle
      responses:
        "200": { description: Sleep-cycle report with evidence-backed proposals }
        "404": { description: Sleep cycle not found for the authenticated owner }
  /v1/memory/sleep-cycles/{sleep_cycle_id}/commit:
    parameters:
      - in: path
        name: sleep_cycle_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: commitMemorySleepCycleProposals
      description: Commits only selected proposals from a persisted dry run through the structured-memory authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, change_ids]
              properties:
                idempotency_key: { type: string, minLength: 1 }
                change_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "201": { description: Selected proposals committed idempotently }
        "400": { description: "Invalid, unavailable, oversized, or mismatched proposal set" }
        "404": { description: Source sleep cycle not found }
  /v1/turns/text:
    post:
      operationId: submitTextTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                session_id:
                  type: string
                  description: Compatibility alias; authenticated devices resume their server-owned active conversation.
                text: { type: string, minLength: 1, maxLength: 8000 }
                provider:
                  type: string
                  description: Optional explicit provider hint for trusted clients.
                request_id:
                  type: string
                  description: Stable idempotency key; required when attachment_ids is non-empty.
                attachment_ids:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Completed text turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "400":
          description: Invalid JSON or missing text
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: VoiceOSDeviceCredential
  parameters:
    DeviceAuthorization:
      in: header
      name: Authorization
      required: true
      schema: { type: string, pattern: "^Bearer .+" }
      description: Bearer credential issued during device enrollment.
  schemas:
    ClientBootstrap:
      type: object
      required: [contract_version, device_id, authentication, component_registry, endpoints, transport]
      properties:
        contract_version: { type: integer, const: 1 }
        device_id: { type: string }
        authentication:
          type: object
          required: [scheme]
          properties:
            scheme: { type: string, const: bearer }
        component_registry:
          $ref: "#/components/schemas/ComponentRegistry"
        endpoints:
          type: object
          required: [bootstrap, conversation, conversation_events, turn]
          properties:
            bootstrap: { type: string, const: /v1/client/bootstrap }
            conversation: { type: string, const: /v1/conversations/active }
            conversation_events: { type: string, const: /v1/conversations/active/events }
            turn: { type: string, const: /v1/turns/text }
